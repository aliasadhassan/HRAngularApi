<header class="topbar">
  <button
    type="button"
    class="icon-btn menu-btn"
    (click)="layout.openMobile()"
    [attr.aria-label]="'topbar.openMenu' | translate"
  >
    <span class="material-icons-outlined" aria-hidden="true">menu</span>
  </button>

  <h1 class="page-title">{{ titleKey() | translate }}</h1>

  <div class="actions">
    <button type="button" class="lang-btn" (click)="language.toggle()">
      {{ 'topbar.switchLanguage' | translate }}
    </button>

    <button type="button" class="icon-btn" [attr.aria-label]="'topbar.notifications' | translate">
      <span class="material-icons-outlined" aria-hidden="true">notifications</span>
      <span class="dot" aria-hidden="true"></span>
    </button>

    <div class="profile">
      <button
        type="button"
        class="profile-btn"
        (click)="toggleMenu($event)"
        [attr.aria-expanded]="menuOpen()"
        aria-haspopup="menu"
      >
        <span class="avatar" aria-hidden="true">{{ user.initials }}</span>
        <span class="profile-name">{{ user.name }}</span>
        <span class="material-icons-outlined chevron" aria-hidden="true">expand_more</span>
      </button>

      @if (menuOpen()) {
        <div class="menu" role="menu" (click)="$event.stopPropagation()">
          <div class="menu-head">
            <span class="menu-name">{{ user.name }}</span>
            @if (user.email) {
              <span class="menu-email">{{ user.email }}</span>
            }
          </div>
          <a role="menuitem" routerLink="/app/settings" (click)="closeMenu()">
            <span class="material-icons-outlined" aria-hidden="true">settings</span>
            {{ 'topbar.settings' | translate }}
          </a>
          <button type="button" role="menuitem" class="danger" (click)="logout()">
            <span class="material-icons-outlined" aria-hidden="true">logout</span>
            {{ 'topbar.logout' | translate }}
          </button>
        </div>
      }
    </div>
  </div>
</header>
