<!-- ngClass use karke 'collapsed' class add ya remove kar rahe hain -->
<aside class="sidebar" [ngClass]="{ 'collapsed': isCollapsed }">
  <div class="sidebar-logo"> 
    <!-- Logo text sirf tab dikhega jab menu expand hoga -->
    @if(!isCollapsed){
      <span>phoenix</span>
    }

  <button class="toggle-btn" (click)="toggleCollapse()" title="Toggle Menu">
   @if(!isCollapsed){
        <span>&#x2715;</span> 
    } @else {
        <span>&#9776;</span> 
    }
  </button>

  </div>

  <div class="sidebar-section">
    @if(!isCollapsed){
    <p class="section-title">PAGES</p>
    }
  </div>
</aside>
