name: Angular Frontend CI/CD Pipeline

on:
  push:
    branches: [ "HRAngularApi" ]
  pull_request:
    branches: [ "HRAngularApi" ]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Login to GitHub Container Registry (GHCR)
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build & Push Angular Frontend Image
      run: |
        docker build -t ghcr.io/${{ github.repository_owner }}/hr-frontend:latest .
        docker push ghcr.io/${{ github.repository_owner }}/hr-frontend:latest
